<style>
html, body {
  margin: 0; padding: 0;
  background: var(--bg-body);
  color: var(--text-main);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
  min-height: 100dvh;
}
body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
}

/* ─── Навбар ──────────────────────────────── */

/* ─── Основной блок ──────────────────────────────── */
.main-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.container {
  max-width: var(--w-content);
  width: 100%;
  text-align: center;
}
.brand {
  font-size: 13px;
  color: var(--text-muted);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 12px;
}
h1 {
  font-size: clamp(1.75rem, 5vw, 2.6rem);
  color: var(--text-title);
  margin: 0 0 8px;
  font-weight: 700;
  letter-spacing: -0.02em;
}
/* Логотип в герое вместо текстового заголовка. Высота подобрана так,
   чтобы слово «deutra» внутри локапа читалось примерно в тот же кегль,
   что и прежний <h1>: слово занимает 64.5 из 215.44 единиц высоты,
   значит при 128px оно выходит ~38px — верхняя граница старого clamp. */
.hero-logo {
  margin: 4px 0 12px;
}
.hero-logo svg {
  display: block;
  margin: 0 auto;
  height: clamp(88px, 22vw, 128px);
  width: auto;
  color: var(--text-title);
}
.subtitle {
  font-size: 15px;
  color: var(--text-muted);
  margin-bottom: 48px;
}
.cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 32px;
}
@media (max-width: 600px) {
  .cards { grid-template-columns: 1fr; }
  h1 { font-size: 26px; }
  .dt-topnav__actions .dt-donate {
    width: 38px;
    height: 38px;
    padding: 0;
    gap: 0;
    justify-content: center;
  }
  .dt-topnav__actions .dt-donate__label { display: none; }
}
.card {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  background: var(--bg-card);
  border: 1px solid var(--border-soft);
  border-radius: 16px;
  padding: 28px 24px;
  text-decoration: none;
  color: var(--text-main);
  box-shadow: var(--shadow);
  transition: transform 0.2s var(--ease-dt), box-shadow 0.2s var(--ease-dt);
  cursor: pointer;
  text-align: left;
}
.card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-hover);
}
.card-icon {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 18px;
  flex-shrink: 0;
}
.card-icon svg { width: 24px; height: 24px; }
.card.cheatsheet .card-icon { background: var(--cyan-100); color: var(--cyan-700); }
.card.trainer .card-icon { background: var(--red-100); color: var(--red-700); }
.card-title {
  font-size: 19px;
  font-weight: 700;
  color: var(--text-title);
  margin-bottom: 6px;
}
.card-desc {
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.5;
  margin-bottom: 22px;
}
.card .dt-cta {
  pointer-events: none;
  margin-top: auto;
  padding: 5px 5px 5px 16px;
  font-size: 13px;
}
.card:hover .dt-cta__roll-inner { transform: translateY(-50%); }
.card:hover .dt-cta__arrow { transform: rotate(-45deg); }
.card.cheatsheet:hover { border-color: var(--accent); }
.card.trainer:hover { border-color: var(--accent); }
/* ─── Кнопка "Поддержать" ──────────────────────── */
.dt-topnav__actions {
  display: flex;
  align-items: center;
  gap: 10px;
}
.dt-donate {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 18px;
  border-radius: 999px;
  border: 1.5px solid var(--accent);
  background: transparent;
  color: var(--accent);
  font-size: 13px;
  font-weight: 600;
  font-family: inherit;
  line-height: 1;
  cursor: pointer;
  transition: filter 0.2s var(--ease-dt), transform 0.15s var(--ease-dt);
}
.dt-donate svg { width: 15px; height: 15px; display: block; }
.dt-donate:hover { filter: brightness(0.88); }
.dt-donate:active { transform: scale(0.96); }

/* ─── Футер ──────────────────────── */

/* ─── Тост "Появится позже" ──────────────────────── */

/* ─── Модалка changelog ──────────── */
.changelog-modal {
  position: absolute;
  top: 68px;
  right: 16px;
  width: 360px;
  max-width: calc(100vw - 32px);
  background: var(--bg-card);
  border: 1px solid var(--border-soft);
  border-radius: 10px;
  box-shadow: var(--shadow-modal);
  z-index: 100;
  display: none;
  text-align: left;
  overflow: hidden;
}
.changelog-modal.open { display: block; }
.changelog-modal.expanded {
  max-height: calc(100vh - 80px);
  max-height: calc(100dvh - 80px);
  display: flex;
  flex-direction: column;
}
.changelog-list {
  padding: 4px 0;
  overflow-y: auto;
}
.changelog-modal.expanded .changelog-list {
  flex: 1;
  min-height: 0;
}
.changelog-entry {
  padding: 16px 18px;
  border-bottom: 1px solid var(--border-soft);
}
.changelog-entry:last-child { border-bottom: none; }
.changelog-date {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 6px;
}
.changelog-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-title);
  margin-bottom: 8px;
}
.changelog-items {
  margin: 0;
  padding: 0;
  list-style: none;
}
.changelog-items li {
  font-size: 13px;
  color: var(--text-main);
  line-height: 1.5;
  padding-left: 12px;
  position: relative;
  margin-bottom: 4px;
}
.changelog-items li::before {
  content: "–";
  position: absolute;
  left: 0;
  color: var(--text-muted);
}
.changelog-more {
  width: 100%;
  padding: 10px;
  background: transparent;
  border: none;
  border-top: 1px solid var(--border-soft);
  color: var(--text-muted);
  font-size: 13px;
  cursor: pointer;
  flex-shrink: 0;
}
.changelog-more:hover { color: var(--text-main); }
.changelog-empty {
  padding: 24px 18px;
  color: var(--text-muted);
  font-size: 13px;
  text-align: center;
}
.changelog-close {
  display: none;
  position: absolute;
  top: 8px;
  right: 8px;
  width: 32px;
  height: 32px;
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 22px;
  cursor: pointer;
  line-height: 1;
  padding: 0;
}

/* Мобила: модалка на весь экран */
@media (max-width: 600px) {
  .changelog-modal {
    position: fixed;
    inset: 0;
    top: 0;
    right: 0;
    width: 100%;
    max-width: none;
    border-radius: 0;
    border: none;
    max-height: 100vh;
    max-height: 100dvh;
  }
  .changelog-modal.open {
    display: flex;
    flex-direction: column;
  }
  .changelog-modal .changelog-list { flex: 1; min-height: 0; }
  .changelog-close { display: block; }
}

<script>
// Инициализация темы ДО рендера. 'auto' резолвим через системную настройку
// сразу же — theme.css больше не дублирует палитру в @media (prefers-color-scheme),
// цвета живут только в :root / .theme-dark, поэтому класс нужен всегда явно.
(function() {
  var saved = localStorage.getItem('theme') || 'auto';
  var resolved = saved === 'auto'
    ? ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light')
    : saved;
  document.documentElement.classList.add('theme-' + resolved);
})();
</script>

<script>
var THEME_ICONS = {
  auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 0 0 20z" fill="currentColor" stroke="none"/></svg>',
  light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>',
  dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>'
};
function applyThemeIcon(theme) {
  var el = document.getElementById('theme-icon-wrap');
  var btn = document.getElementById('theme-btn');
  if (el) el.innerHTML = THEME_ICONS[theme] || THEME_ICONS.auto;
  if (btn) btn.title = t('theme.prefix') + (theme === 'auto' ? t('theme.auto') : (theme === 'dark' ? t('theme.dark') : t('theme.light')));
}
function applyThemeClass(theme) {
  var html = document.documentElement;
  html.classList.remove('theme-light', 'theme-dark');
  var resolved = theme === 'auto'
    ? ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light')
    : theme;
  html.classList.add('theme-' + resolved);
}
function cycleTheme() {
  var saved = localStorage.getItem('theme') || 'auto';
  var next;
  if (saved === 'auto') next = 'light';
  else if (saved === 'light') next = 'dark';
  else next = 'auto';
  applyThemeClass(next);
  localStorage.setItem('theme', next);
  applyThemeIcon(next);
}
// Если выбран 'auto' и система меняет тему — перерисовываемся без перезагрузки
if (window.matchMedia) {
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
    if ((localStorage.getItem('theme') || 'auto') === 'auto') applyThemeClass('auto');
  });
}
applyThemeIcon(localStorage.getItem('theme') || 'auto');

// ─── Заглушка "Появится позже" (донат, соцсети, профиль/установка/FAQ/о проекте/обратная связь) ──
var SITE_VERSION = 'v5.2 beta';

// ─── Changelog ──────────────────────────────────
var CHANGELOG = [];
var MODAL_EXPANDED = false;

function formatDate(iso) {
  var p = iso.split('-');
  return p[2] + '.' + p[1] + '.' + p[0];
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function renderEntry(e) {
  var title = (getLang() === 'en' && e.titleEn) ? e.titleEn : e.title;
  var items = (getLang() === 'en' && e.itemsEn) ? e.itemsEn : e.items;
  var html = '<div class="changelog-entry">';
  html += '<div class="changelog-date">' + escapeHtml(formatDate(e.date)) + '</div>';
  if (title) html += '<div class="changelog-title">' + escapeHtml(title) + '</div>';
  if (items && items.length) {
    html += '<ul class="changelog-items">';
    items.forEach(function(it) {
      html += '<li>' + escapeHtml(it) + '</li>';
    });
    html += '</ul>';
  }
  html += '</div>';
  return html;
}

function renderChangelog() {
  var list = document.getElementById('changelog-list');
  var moreBtn = document.getElementById('changelog-more');
  if (!CHANGELOG.length) {
    list.innerHTML = '<div class="changelog-empty">' + t('changelog.empty') + '</div>';
    moreBtn.style.display = 'none';
    return;
  }
  if (MODAL_EXPANDED) {
    list.innerHTML = CHANGELOG.map(renderEntry).join('');
  } else {
    list.innerHTML = renderEntry(CHANGELOG[0]);
  }
  // Показываем "more" только если есть что разворачивать
  if (CHANGELOG.length > 1) {
    moreBtn.style.display = 'block';
    moreBtn.textContent = MODAL_EXPANDED ? t('changelog.less') : t('changelog.more');
  } else {
    moreBtn.style.display = 'none';
  }
}

function updateDot() {
  var dot = document.getElementById('bell-dot');
  if (!CHANGELOG.length) { dot.classList.remove('active'); return; }
  var lastSeen = localStorage.getItem('last_seen_changelog_date');
  if (!lastSeen || lastSeen < CHANGELOG[0].date) {
    dot.classList.add('active');
  } else {
    dot.classList.remove('active');
  }
}

function openChangelog() {
  var modal = document.getElementById('changelog-modal');
  MODAL_EXPANDED = false;
  modal.classList.remove('expanded');
  modal.classList.add('open');
  renderChangelog();
  if (CHANGELOG.length) {
    localStorage.setItem('last_seen_changelog_date', CHANGELOG[0].date);
    updateDot();
  }
}

function closeChangelog() {
  var modal = document.getElementById('changelog-modal');
  modal.classList.remove('open', 'expanded');
  MODAL_EXPANDED = false;
}

function toggleChangelog(ev) {
  ev.stopPropagation();
  var modal = document.getElementById('changelog-modal');
  if (modal.classList.contains('open')) closeChangelog();
  else openChangelog();
}

function toggleExpand() {
  var modal = document.getElementById('changelog-modal');
  MODAL_EXPANDED = !MODAL_EXPANDED;
  if (MODAL_EXPANDED) modal.classList.add('expanded');
  else modal.classList.remove('expanded');
  renderChangelog();
}

// Клик вне модалки
document.addEventListener('click', function(ev) {
  var modal = document.getElementById('changelog-modal');
  var bell = document.getElementById('bell-btn');
  if (!modal.classList.contains('open')) return;
  if (modal.contains(ev.target) || bell.contains(ev.target)) return;
  closeChangelog();
});

// Esc
document.addEventListener('keydown', function(ev) {
  if (ev.key === 'Escape') closeChangelog();
});

function renderFooterUpdate() {
  var footerUpdate = document.getElementById('footer-update');
  if (!footerUpdate) return;
  var dateStr = CHANGELOG.length ? formatDate(CHANGELOG[0].date) : '–';
  footerUpdate.textContent = t('footer.update_label') + ' ' + dateStr + ' - ' + SITE_VERSION + ' · ' + t('footer.open_project');
}

// Загрузка changelog.js (работает и через file://, в отличие от fetch json)
(function loadChangelog() {
  var s = document.createElement('script');
  s.src = 'changelog.js?v=' + Date.now();
  s.onload = function() {
    var data = window.CHANGELOG;
    CHANGELOG = Array.isArray(data) ? data.slice(0, 10) : [];
    updateDot();
    renderFooterUpdate();
  };
  s.onerror = function() { /* нет файла – без точки, без модалки */ };
  document.head.appendChild(s);
})();

// ─── i18n: применяем сохранённый язык, освежаем то, что рантайм сам не знает
// как обновить (title кнопки темы зависит и от темы, и от языка; счётчик
// в футере и empty-state changelog строятся в JS, а не через data-i18n) ──
window.onI18nApplied = function() {
  applyThemeIcon(localStorage.getItem('theme') || 'auto');
  renderFooterUpdate();
  if (document.getElementById('changelog-modal').classList.contains('open')) renderChangelog();
};
applyI18n();
</script>

<!-- Выключатель счётчика для своих устройств. На телефоне консоли нет, поэтому
     флаг ставится через адрес: открыть сайт с #skipgc в конце. #unskipgc снимает.
     Стоит выше count.js намеренно: тот грузится async и выполнится позже этого
     скрипта, значит флаг успеет встать до первого подсчёта. -->
<script>
(function () {
  var h = location.hash;
  if (h !== '#skipgc' && h !== '#unskipgc') return;
  var off = h === '#skipgc';
  try {
    if (off) localStorage.setItem('skipgc', 't');
    else localStorage.removeItem('skipgc');
  } catch (e) { return; }   // приватный режим: localStorage может бросить

  var n = document.createElement('div');
  n.textContent = off ? 'Счётчик выключен на этом устройстве' : 'Счётчик снова включён';
  n.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9999;'
    + 'background:#171717;color:#fff;padding:10px 18px;border-radius:999px;'
    + 'font:14px system-ui,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.25)';
  document.body.appendChild(n);
  setTimeout(function () { n.remove(); }, 4000);

  // убираем хэш из адреса, чтобы случайно не расшарить ссылку с выключателем
  history.replaceState(null, '', location.pathname + location.search);
})();
</script>

<!-- Счётчик посещений GoatCounter. Без cookies и без записи в localStorage,
     поэтому баннера согласия не требует (§25 TDDDG к нему не применяется).
     Свои визиты исключаются командой в консоли: localStorage.setItem('skipgc','t') -->
<script data-goatcounter="https://r4studio.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
